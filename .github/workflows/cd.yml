name: CD

# Deploys on every push to master/main. Setup (Render blueprint, Vercel project, the five
# repo secrets below) is documented in CD_PIPELINE.md — until those exist, the build job
# still runs and the deploy steps skip themselves with a warning rather than failing red.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build all three services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Backend (Java / Spring Boot) ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Build backend
        working-directory: backend
        # chmod because mvnw is committed without the executable bit (Windows checkout).
        # -DskipTests on purpose: the only test is @SpringBootTest contextLoads(), which boots
        # the entire app and needs a reachable Supabase DB + JWT_SECRET. See CD_PIPELINE.md.
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      # ---------- Frontend (React / Vite) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------- ML service (Python / FastAPI) ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ML service
        working-directory: python
        run: |
          pip install -r requirements.txt
          python -m compileall app

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each step guards on its own secret *inside* the step rather than via a job-level `if:`,
      # because the `secrets` context isn't available in job-level conditions.
      - name: Deploy backend to Render
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_BACKEND_DEPLOY_HOOK not set — skipping backend deploy (see CD_PIPELINE.md)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered Render backend deploy."

      - name: Deploy ML service to Render
        env:
          HOOK: ${{ secrets.RENDER_ML_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_ML_DEPLOY_HOOK not set — skipping ML service deploy (see CD_PIPELINE.md)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered Render ML service deploy."

      - name: Deploy frontend to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not set — skipping frontend deploy (see CD_PIPELINE.md)"
            exit 0
          fi
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
