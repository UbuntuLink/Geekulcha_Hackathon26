# Allow .env to be accessed in properties. Both paths are tried so this works whether you run
# Maven from the repo root or from backend/ (the usual `cd backend && ./mvnw spring-boot:run`).
# Both are "optional:" so this doesn't crash startup on Render, where there's no .env file at
# all — real values come from Render's env var dashboard instead.
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

spring.application.name=backend
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Render provides the port to bind via $PORT; defaults to 8080 for local dev
server.port=${PORT:8080}

# Google OAuth2 login (PROJECT.md §8) — TEMPORARILY DISABLED (see SecurityConfig.java) so the
# app can boot without Google credentials. Even a blank client-id crashes Spring Security's
# OAuth2 autoconfiguration at startup, so these must stay fully commented out, not just empty,
# until you're ready to wire auth back in. To re-enable: uncomment these, set GOOGLE_CLIENT_ID/
# GOOGLE_CLIENT_SECRET in backend/.env (get them from
# https://console.cloud.google.com/apis/credentials), and restore .oauth2Login(...) in
# SecurityConfig.java.
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=openid,email,profile

# React app origin, used for CORS (config/SecurityConfig.java)
frontend.url=${FRONTEND_URL:http://localhost:5173}