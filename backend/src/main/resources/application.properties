# Allow .env to be accessed in properties. Both paths are tried so this works whether you run
# Maven from the repo root or from backend/ (the usual `cd backend && ./mvnw spring-boot:run`).
# Both are "optional:" so this doesn't crash startup on Render, where there's no .env file at
# all — real values come from Render's env var dashboard instead.
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

spring.application.name=backend
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Render provides the port to bind via $PORT; defaults to 8080 for local dev
server.port=${PORT:8080}

# Email/password + JWT auth (PROJECT.md §8) — config/SecurityConfig.java reads JWT_SECRET
# directly via @Value("${JWT_SECRET}") (no property line needed here, same pattern as
# SUPABASE_DB_URL above). Generate a random 32+ character string for local dev (backend/.env);
# set a real one in Render's env vars.

# React app origin, used for CORS (config/SecurityConfig.java)
frontend.url=${FRONTEND_URL:http://localhost:5173}


# Empty default on purpose: CheckIdService takes this through a constructor @Value, so with a
# bare ${CHECKID_API_KEY} the whole application refuses to start on any machine that hasn't set
# the variable — which was every machine, and Render. A blank key now fails the ID-validation
# call itself instead of taking the entire backend down with it, the same way a missing
# OPEN_ROUTER_API_KEY fails only the ML request. Set it in backend/.env to use ID validation.
checkid.api-key=${CHECKID_API_KEY:}
checkid.base-url=https://api.checkid.co.za