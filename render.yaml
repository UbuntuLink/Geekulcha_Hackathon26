services:
  - type: web
    name: ubuntulink-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Public URL of ubuntulink-ml-service, for the quantum provider match.
      - key: ML_SERVICE_URL
        sync: false

  - type: web
    name: ubuntulink-ml-service
    runtime: python
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # The model provider's key. Defaults to Gemini — set LLM_BASE_URL and LLM_MODEL too if
      # you point it elsewhere (see python/app/core/llm_client.py).
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
